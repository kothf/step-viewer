name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to a PR cancels its older run; on main every commit gets its own run at once (no
# waiting for the one before), since the release of that commit uses its result instead of testing again
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (kernel, sketch solver, documents)
        run: npm run test:unit

  # The browser smoke test in 6 parallel shards (SMOKE_SHARD, see tests/smoke.mjs), about 5 minutes each
  # instead of 9 minutes in one job. Each job packages the build itself: that takes ~15 s, less than
  # passing it between jobs as an artifact would.
  smoke:
    name: smoke ${{ matrix.shard }}/6
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Browser for the tests
        run: npx playwright install --only-shell chromium || npx playwright install --with-deps --only-shell chromium

      - name: Package
        run: npm run package

      - name: Smoke test (packaged build), shard ${{ matrix.shard }}/6
        env:
          SMOKE_SHARD: ${{ matrix.shard }}/6
        run: npm test

  # One check that is green only when every job above is (the Release workflow reads the whole run's result).
  test:
    needs: [unit, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All tests passed
        run: |
          [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.smoke.result }}" = success ] || { echo "::error::unit: ${{ needs.unit.result }}, smoke: ${{ needs.smoke.result }}"; exit 1; }
