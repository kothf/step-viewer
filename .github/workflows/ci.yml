name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels its older run. On main the run in progress always finishes, and of the
# commits pushed meanwhile only the newest one waits (GitHub drops older pending runs of the group): with
# merges a few minutes apart main is not tested commit by commit (each run takes 7 of the account's 20
# concurrent jobs). Releasing a main commit that got no CI run tests it in the Release workflow instead
# (see "CI result for this commit" there).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The account's free GitHub-hosted minutes ran out in November 2026 (the private site repo used them), so
# CI runs on the self-hosted runners on Andrey's desktop (label "desktop", 4 runners on a 4-core/8-thread
# i7 with 15 GB): one job installs and packages once, then runs the unit tests and 4 smoke shards as
# parallel processes. PRs from forks never reach the desktop: they keep the GitHub-hosted jobs below.
jobs:
  desktop:
    name: desktop (unit + smoke)
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: [self-hosted, desktop]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --prefer-offline --no-audit --no-fund

      # ~/.cache/ms-playwright stays on the desktop between runs; the runner's .env sets
      # PLAYWRIGHT_HOST_PLATFORM_OVERRIDE, since Playwright does not know its Debian release
      - name: Browser for the tests
        run: npx playwright install --only-shell chromium

      - name: Package
        run: npm run package

      - name: Unit tests and smoke test in 4 shards, in parallel
        run: |
          mkdir -p ci-logs
          npm run test:unit > ci-logs/unit.log 2>&1 & pids="$!"
          for i in 1 2 3 4; do SMOKE_SHARD=$i/4 npm test > ci-logs/smoke-$i.log 2>&1 & pids="$pids $!"; done
          fail=0; for p in $pids; do wait $p || fail=1; done
          for f in ci-logs/unit.log ci-logs/smoke-*.log; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
          grep -h "^shard " ci-logs/smoke-*.log || true
          exit $fail

  unit:
    name: unit tests
    if: ${{ github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (kernel, sketch solver, documents)
        run: npm run test:unit

  # The browser smoke test in 6 parallel shards (SMOKE_SHARD, see tests/smoke.mjs), about 5 minutes each
  # instead of 9 minutes in one job. Each job packages the build itself: that takes ~15 s, less than
  # passing it between jobs as an artifact would.
  smoke:
    name: smoke ${{ matrix.shard }}/6
    if: ${{ github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Browser for the tests
        run: npx playwright install --only-shell chromium || npx playwright install --with-deps --only-shell chromium

      - name: Package
        run: npm run package

      - name: Smoke test (packaged build), shard ${{ matrix.shard }}/6
        env:
          SMOKE_SHARD: ${{ matrix.shard }}/6
        run: npm test

  # One check that is green only when the jobs above are (the Release workflow reads the whole run's result).
  test:
    needs: [desktop, unit, smoke]
    if: always()
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","desktop"]') }}
    timeout-minutes: 2
    steps:
      - name: All tests passed
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = true ]; then
            [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.smoke.result }}" = success ]
          else
            [ "${{ needs.desktop.result }}" = success ]
          fi || { echo "::error::desktop: ${{ needs.desktop.result }}, unit: ${{ needs.unit.result }}, smoke: ${{ needs.smoke.result }}"; exit 1; }
